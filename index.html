<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Tapak Suci Putera Muhammadiyah- Persatuan Silat Baitussalam PERSIBA- Cabang Pondok Modern Baitussalam Simalungun</title>
<link rel="icon" href="logo.jpg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g1:#064e32;--g2:#1b8a4b;--gold:#d4af37;--gold2:#f3dc85;--ink:#16301f;--bg:#f4f7f1;--line:#dfe6d6}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
button,input,select{font:inherit}
aside{width:260px;background:linear-gradient(170deg,var(--g1),var(--g2));color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0;border-right:4px solid var(--gold)}
.brand{text-align:center;margin-bottom:12px}
.logo{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;background:url(logo.jpg) center/cover;border:3px solid var(--gold);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.brand b{display:block;font-size:15px;color:var(--gold2);line-height:1.3}
.brand small{opacity:.85}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:11px 14px;border-radius:8px;cursor:pointer;font-size:15px;border-left:4px solid transparent}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:rgba(212,175,55,.2);border-left-color:var(--gold);color:var(--gold2)}
.side-foot{margin-top:auto}
main{flex:1;padding:26px;min-width:0}
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:24px;background:linear-gradient(90deg,var(--g1),#8a6d12);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;padding:9px 15px;border-radius:8px;cursor:pointer;border-bottom:3px solid var(--gold)}
.btn.gold{background:linear-gradient(135deg,#b8901c,var(--gold2));color:#2b2100;border-bottom-color:#8a6d12}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.red{background:#a32a2a;border-bottom-color:#611}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:14px;padding:18px;border-bottom:5px solid var(--gold)}
.stat b{font-size:38px;display:block;color:var(--gold2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select,.f input,.f select{padding:9px 11px;border:1px solid #c5d1b8;border-radius:8px;background:#fff}
.bar input{flex:1;min-width:160px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;text-align:left;padding:10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fbf8e8}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#dfe6d6;border:2px solid var(--gold)}
.tag{background:#fff6d1;border:1px solid var(--gold);border-radius:20px;padding:2px 9px;font-size:12px;white-space:nowrap}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(6,40,25,.6)}
.dh{background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--gold2);padding:14px 18px;font-size:18px;border-bottom:3px solid var(--gold)}
.db{padding:18px;overflow:auto;max-height:70vh}
.df{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.f .w{grid-column:1/-1}
.hint{font-size:12px;color:#6a7a5c}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.gal div{position:relative}
.gal img{width:100%;height:90px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.gal button{position:absolute;top:2px;right:2px;background:#a32a2a;color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.pv{max-width:100%;max-height:190px;border-radius:8px;margin-top:6px;border:1px solid var(--line)}
.dt{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:14px}
.dt span:nth-child(odd){color:#6a7a5c}
.empty{text-align:center;padding:30px;color:#6a7a5c}
.menu-btn{display:none}
@media(max-width:800px){
 aside{position:fixed;left:-270px;z-index:5;transition:left .2s}aside.open{left:0}
 .menu-btn{display:inline-block}main{padding:16px}.f{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<aside id="side">
 <div class="brand"><div class="logo"></div><b>Tapak Suci<br>Pesantren Baitussalam</b><small>Simalungun</small></div>
 <nav id="nav"></nav>
 <div class="side-foot"><button class="btn gold" id="loginBtn" style="width:100%"></button></div>
</aside>
<main>
 <header class="top"><div><button class="btn sm menu-btn" onclick="side.classList.toggle('open')">Menu</button> <h1 id="title" style="display:inline-block"></h1></div><div id="actions" class="bar" style="margin:0"></div></header>
 <div id="view"></div>
</main>
<dialog id="dlg"></dialog>

<script>
const LV={
 siswa:['Siswa Dasar','Siswa Satu','Siswa Dua','Siswa Tiga','Siswa Empat'],
 kader:['Kader Dasar / Biru Dasar (K.Da)','Kader Muda / Biru Melati 1 (K.Ma)','Kader Madya / Biru Melati 2 (K.Mdy)','Kader Kepala / Biru Melati 3 (K.Ka)','Kader Utama / Biru Melati 4 (K.Ua)'],
 pendekar:['Pendekar Muda / Hitam Melati 1 (P.Ma)','Pendekar Madya / Hitam Melati 2 (P.Mdy)','Pendekar Kepala / Hitam Melati 3 (P.Ka)','Pendekar Utama / Hitam Melati 4 (P.Ua)','Pendekar Besar / Hitam Melati 5 (P.Br)']
};
const NAMA={siswa:'Siswa',kader:'Kader',pendekar:'Pendekar'};
let db={siswa:[],kader:[],pendekar:[],pass:'admin123'},admin=false,page='dashboard',cur=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Penyimpanan (IndexedDB di browser) ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const idb=()=>new Promise(r=>{const q=indexedDB.open('tsdb',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
async function load(){const d=await idb();return new Promise(r=>{const g=d.transaction('k').objectStore('k').get('db');g.onsuccess=()=>{if(g.result)db=Object.assign(db,g.result);r()}})}
async function save(){const d=await idb();d.transaction('k','readwrite').objectStore('k').put(db,'db')}
function img(file,max){return new Promise(r=>{const f=new FileReader();f.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=f.result};f.readAsDataURL(file)})}

/* ---------- Navigasi ---------- */
function nav(){
 const items=[['dashboard','Beranda'],['siswa','Data Siswa'],['kader','Data Kader'],['pendekar','Data Pendekar'],['pengaturan','Pengaturan']];
 $('nav').innerHTML=items.map(([k,t])=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
 $('loginBtn').textContent=admin?'Keluar admin':'Masuk sebagai admin';
}
function go(p){page=p;side.classList.remove('open');nav();render()}
$('loginBtn').onclick=()=>{
 if(admin){admin=false}else{const p=prompt('Kata sandi admin:');if(p===null)return;if(p===db.pass)admin=true;else return alert('Kata sandi salah.')}
 nav();render();
};
function render(){
 const a=$('actions');a.innerHTML='';
 if(page==='dashboard')return dash();
 if(page==='pengaturan')return settings();
 listView(page);
}

/* ---------- Beranda ---------- */
function dash(){
 $('title').textContent='Beranda';
 const tot=db.siswa.length+db.kader.length+db.pendekar.length;
 $('view').innerHTML=`<div class="stats">
 <div class="stat"><b>${tot}</b>Total anggota</div>
 ${['siswa','kader','pendekar'].map(t=>`<div class="stat" style="cursor:pointer" onclick="go('${t}')"><b>${db[t].length}</b>${NAMA[t]}</div>`).join('')}</div>
 <div class="card"><h3 style="margin-top:0">Sebaran tingkatan</h3><div class="tw"><table><tr><th>Jenjang</th><th>Tingkatan</th><th>Jumlah</th></tr>
 ${['siswa','kader','pendekar'].map(t=>LV[t].map(l=>`<tr><td>${NAMA[t]}</td><td>${esc(l)}</td><td>${db[t].filter(x=>x.tingkat===l).length}</td></tr>`).join('')).join('')}</table></div></div>`;
}

/* ---------- Daftar anggota ---------- */
function listView(t){
 $('title').textContent='Data '+NAMA[t];
 if(admin)$('actions').innerHTML=`<button class="btn" onclick="form('${t}')">+ Tambah ${NAMA[t]}</button><button class="btn gold" onclick="tpl('${t}')">Template Excel</button><button class="btn gold" onclick="impIn.dataset.t='${t}';impIn.click()">Impor Excel</button><button class="btn gold" onclick="exp('${t}')">Ekspor</button><input type="file" id="impIn" accept=".xlsx,.xls,.csv" hidden onchange="imp(this)">`;
 else $('actions').innerHTML=`<button class="btn gold" onclick="exp('${t}')">Ekspor Excel</button>`;
 $('view').innerHTML=`<div class="card"><div class="bar"><input id="q" placeholder="Cari nama, alamat, atau kode KTA..." oninput="rows('${t}')"><select id="fl" onchange="rows('${t}')"><option value="">Semua tingkatan</option>${LV[t].map(l=>`<option>${esc(l)}</option>`).join('')}</select></div><div class="tw" id="tbl"></div></div>`;
 rows(t);
}
function rows(t){
 const q=($('q').value||'').toLowerCase(),f=$('fl').value;
 const d=db[t].filter(x=>(!f||x.tingkat===f)&&[x.nama,x.alamat,x.kta].join(' ').toLowerCase().includes(q));
 $('tbl').innerHTML=d.length?`<table><tr><th>No</th><th>Foto</th><th>Nama</th><th>L/P</th><th>Masuk</th><th>Tingkatan terakhir</th><th>KTA</th><th>Aksi</th></tr>${d.map((x,i)=>`<tr>
 <td>${i+1}</td><td>${x.foto?`<img class="av" src="${x.foto}" alt="">`:'<div class="av"></div>'}</td><td><b>${esc(x.nama)}</b></td><td>${x.jk==='Laki-laki'?'L':'P'}</td><td>${esc(x.tahun)}</td><td><span class="tag">${esc(x.tingkat)}</span></td>
 <td>${esc(x.kta||(x.ktaImg?'Ada berkas':'-'))}</td>
 <td style="white-space:nowrap"><button class="btn sm" onclick="detail('${t}','${x.id}')">Detail</button>${admin?` <button class="btn sm gold" onclick="form('${t}','${x.id}')">Ubah</button> <button class="btn sm red" onclick="del('${t}','${x.id}')">Hapus</button>`:''}</td></tr>`).join('')}</table>`:`<div class="empty">Belum ada data ${NAMA[t].toLowerCase()}.${admin?' Klik "Tambah" atau "Impor Excel".':' Admin dapat menambahkan data setelah masuk.'}</div>`;
}

/* ---------- Detail ---------- */
function detail(t,id){
 const x=db[t].find(a=>a.id===id);
 $('dlg').innerHTML=`<div class="dh">${esc(x.nama)}</div><div class="db">
 <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px">${x.foto?`<img src="${x.foto}" style="width:120px;height:150px;object-fit:cover;border-radius:10px;border:3px solid var(--gold)" alt="">`:''}
 <div class="dt" style="flex:1;min-width:220px"><span>Jenjang</span><span>${NAMA[t]}</span><span>Jenis kelamin</span><span>${esc(x.jk)}</span><span>Tahun masuk</span><span>${esc(x.tahun)}</span><span>Tingkatan terakhir</span><span>${esc(x.tingkat)}</span><span>Kode/No. KTA</span><span>${esc(x.kta||'-')}</span><span>Alamat</span><span>${esc(x.alamat||'-')}</span><span>No. kontak</span><span>${esc(x.kontak||'-')}</span></div></div>
 ${x.ktaImg?`<b>Kartu Tanda Anggota</b><br><img class="pv" src="${x.ktaImg}" alt="KTA"><br>`:''}
 ${(x.keg||[]).length?`<b>Foto kegiatan</b><div class="gal">${x.keg.map(s=>`<div><img src="${s}" onclick="window.open(this.src)" alt="Kegiatan"></div>`).join('')}</div>`:''}
 </div><div class="df"><button class="btn" onclick="dlg.close()">Tutup</button></div>`;
 $('dlg').showModal();
}

/* ---------- Form tambah/ubah ---------- */
function form(t,id){
 const x=id?db[t].find(a=>a.id===id):{};
 cur={t,id,foto:x.foto||'',ktaImg:x.ktaImg||'',keg:[...(x.keg||[])]};
 const sis=t==='siswa';
 $('dlg').innerHTML=`<div class="dh">${id?'Ubah':'Tambah'} ${NAMA[t]}</div><div class="db"><div class="f">
 <label class="w">Nama lengkap<input id="fn" value="${esc(x.nama)}"></label>
 <label>Jenis kelamin<select id="fj"><option>Laki-laki</option><option ${x.jk==='Perempuan'?'selected':''}>Perempuan</option></select></label>
 <label>Tahun masuk Tapak Suci<input id="ft" type="number" min="1963" max="2100" value="${esc(x.tahun||new Date().getFullYear())}"></label>
 <label class="w">Tingkatan terakhir<select id="fl2">${LV[t].map(l=>`<option ${x.tingkat===l?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
 <label class="w">${sis?'Kode KTA (diisi manual oleh admin)':'No. KTA (diterbitkan Pimpinan Pusat, boleh dikosongkan)'}<input id="fk" value="${esc(x.kta)}" placeholder="${sis?'contoh: TS-SMB-001':'isi bila sudah terbit'}"></label>
 <label class="w">Alamat<input id="fa" value="${esc(x.alamat)}"></label>
 <label class="w">No. kontak<input id="fc" value="${esc(x.kontak)}" inputmode="tel"></label>
 <label class="w">Foto anggota<input type="file" accept="image/*" onchange="pick(this,'foto',400)"><img id="pf" class="pv" style="display:${cur.foto?'block':'none'};max-height:120px" src="${cur.foto}" alt=""></label>
 <label class="w">Berkas KTA (foto/scan)${sis?'':'<span class="hint">KTA kader &amp; pendekar dikeluarkan Pimpinan Pusat; admin tetap dapat mengunggahnya bila perlu.</span>'}<input type="file" accept="image/*" onchange="pick(this,'ktaImg',900)"><img id="pk" class="pv" style="display:${cur.ktaImg?'block':'none'}" src="${cur.ktaImg}" alt=""></label>
 <label class="w">Foto kegiatan (boleh banyak)<input type="file" accept="image/*" multiple onchange="addKeg(this)"><div class="gal" id="gk"></div></label>
 </div></div><div class="df"><button class="btn red" onclick="dlg.close()">Batal</button><button class="btn" onclick="saveF()">Simpan</button></div>`;
 gk();$('dlg').showModal();
}
async function pick(el,k,max){if(!el.files[0])return;cur[k]=await img(el.files[0],max);const p=$(k==='foto'?'pf':'pk');p.src=cur[k];p.style.display='block'}
async function addKeg(el){for(const f of el.files)cur.keg.push(await img(f,800));el.value='';gk()}
function gk(){$('gk').innerHTML=cur.keg.map((s,i)=>`<div><img src="${s}" alt=""><button type="button" onclick="cur.keg.splice(${i},1);gk()" title="Hapus">×</button></div>`).join('')}
async function saveF(){
 const nama=$('fn').value.trim();if(!nama)return alert('Nama wajib diisi.');
 const r={id:cur.id||uid(),nama,jk:$('fj').value,tahun:$('ft').value,tingkat:$('fl2').value,kta:$('fk').value.trim(),alamat:$('fa').value.trim(),kontak:$('fc').value.trim(),foto:cur.foto,ktaImg:cur.ktaImg,keg:cur.keg};
 const a=db[cur.t];if(cur.id)a[a.findIndex(x=>x.id===cur.id)]=r;else a.push(r);
 await save();dlg.close();render();
}
async function del(t,id){if(!confirm('Hapus data ini?'))return;db[t]=db[t].filter(x=>x.id!==id);await save();render()}

/* ---------- Excel ---------- */
const HEAD=['Nama','Jenis Kelamin','Tahun Masuk','Tingkatan Terakhir','Kode/No KTA','Alamat','No Kontak'];
function tpl(t){
 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.aoa_to_sheet([HEAD,['Contoh Nama','Laki-laki',2024,LV[t][0],'','Simalungun','08123456789']]);
 ws['!cols']=HEAD.map(()=>({wch:24}));
 XLSX.utils.book_append_sheet(wb,ws,'Data');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Tingkatan yang berlaku'],...LV[t].map(l=>[l]),[],['Jenis Kelamin: Laki-laki / Perempuan']]),'Petunjuk');
 XLSX.writeFile(wb,`Template_${NAMA[t]}_TapakSuci.xlsx`);
}
function exp(t){
 const ws=XLSX.utils.aoa_to_sheet([HEAD,...db[t].map(x=>[x.nama,x.jk,x.tahun,x.tingkat,x.kta,x.alamat,x.kontak])]);
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,NAMA[t]);XLSX.writeFile(wb,`Data_${NAMA[t]}_TapakSuci.xlsx`);
}
function imp(el){
 const t=el.dataset.t,f=el.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=async()=>{
  const wb=XLSX.read(rd.result,{type:'array'}),rs=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  let n=0;
  for(const r of rs){
   const nama=String(r['Nama']||'').trim();if(!nama)continue;
   const v=String(r['Tingkatan Terakhir']||'').trim().toLowerCase();
   const tk=LV[t].find(l=>l.toLowerCase()===v)||(v&&LV[t].find(l=>l.toLowerCase().includes(v)))||LV[t][0];
   db[t].push({id:uid()+n,nama,jk:/^p/i.test(r['Jenis Kelamin'])?'Perempuan':'Laki-laki',tahun:String(r['Tahun Masuk']||''),tingkat:tk,kta:String(r['Kode/No KTA']||''),alamat:String(r['Alamat']||''),kontak:String(r['No Kontak']||''),foto:'',ktaImg:'',keg:[]});n++;
  }
  await save();el.value='';alert(n+' data berhasil diimpor.');render();
 };
 rd.readAsArrayBuffer(f);
}

/* ---------- Pengaturan & cadangan ---------- */
function settings(){
 $('title').textContent='Pengaturan';
 if(!admin){$('view').innerHTML='<div class="card empty">Masuk sebagai admin untuk membuka pengaturan.</div>';return}
 $('view').innerHTML=`<div class="card"><h3 style="margin-top:0">Cadangan data</h3>
 <p>Data tersimpan di browser perangkat ini. Unduh cadangan secara rutin, lalu pulihkan di perangkat lain bila perlu.</p>
 <button class="btn gold" onclick="bk()">Unduh cadangan (.json)</button> <button class="btn" onclick="rs.click()">Pulihkan dari cadangan</button><input type="file" id="rs" accept=".json" hidden onchange="restore(this)">
 <h3>Kata sandi admin</h3><button class="btn" onclick="cp()">Ganti kata sandi</button></div>`;
}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='cadangan_tapaksuci_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(el){const f=el.files[0];if(!f||!confirm('Data saat ini akan diganti. Lanjutkan?'))return;const r=new FileReader();r.onload=async()=>{try{db=JSON.parse(r.result);await save();alert('Data dipulihkan.');render()}catch{alert('Berkas cadangan tidak valid.')}};r.readAsText(f)}
async function cp(){const p=prompt('Kata sandi baru (min. 6 karakter):');if(p&&p.length>=6){db.pass=p;await save();alert('Kata sandi diganti.')}}

(async()=>{nav();render();try{await load()}catch(e){console.error(e)}render()})();
</script>
</body>
</html>
